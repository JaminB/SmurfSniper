[project]
name = "smurfsniper"
version = "0.1.0"
description = "SmurfSniper doesn’t enjoy your SC2 matches. It audits them. One standard deviation into smurf territory and your opponent is no longer a player, just an entry in a spreadsheet with a very short future."
authors = [
    { name = "JaminB" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.13,<3.15"

dependencies = [
    "pyside6 (>=6.10.1,<7.0.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "loguru (>=0.7.3,<0.8.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pyyaml (>=6.0.2,<7.0.0)",
    "keyboard (>=0.13.5,<0.14.0)",
    "peewee (>=3.18.3,<4.0.0)",
    "click (>=8.1.7,<9.0.0)",
    "platformdirs (>=4.3,<5)"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-qt>=4.4,<5",
  "respx>=0.22,<0.23",
  "ruff>=0.7,<1",
]
build = [
  "pyinstaller==6.11.1",
  "cyclonedx-bom>=5,<6",
]

[project.scripts]
smurfsniper = "smurfsniper.cli:main"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["smurfsniper.spec"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF100"]
ignore = ["E501"]              # formatter owns line length

[tool.ruff.lint.isort]
known-first-party = ["smurfsniper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
addopts = "-ra --strict-markers -m 'not live'"
markers = ["live: hits real network APIs (opt-in: pytest -m live)"]
