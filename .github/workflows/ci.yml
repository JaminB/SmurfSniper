name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }
permissions: { contents: read }
jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: pyproject.toml }
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .
  test:
    runs-on: windows-latest
    strategy: { fail-fast: false, matrix: { python: ["3.13", "3.14"] } }
    env: { QT_QPA_PLATFORM: offscreen }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}", cache: pip, cache-dependency-path: pyproject.toml }
      - run: pip install -e ".[dev]"
      - run: python scripts/check_version.py
      - run: pytest
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions: { pull-requests: read }
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
  build:
    needs: [lint, test]
    uses: ./.github/workflows/build.yml
    with: { upload_to_release: false }
